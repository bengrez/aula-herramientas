<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#143642">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Sesión diagnóstica sin nota, seudonimizada y disponible sin conexión.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Mapa de aprendizaje</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <a class="skip-link" href="#app">Saltar al contenido</a>
  <div class="page-shell">
    <header class="site-header" aria-label="Cabecera de la aplicación">
      <a class="wordmark" href="./" aria-label="Volver al inicio">
        <span class="wordmark-mark" aria-hidden="true">↗</span>
        <span data-ui="brand">Mapa</span>
      </a>
      <div class="header-tools">
        <span class="connection-pill" data-ui="connection" role="status">
          <span class="status-dot" aria-hidden="true"></span>
          <span>Comprobando conexión</span>
        </span>
        <button class="text-size-button" data-action="text-size" type="button" aria-label="Cambiar tamaño del texto">
          <span aria-hidden="true">A</span><span aria-hidden="true">A</span>
        </button>
        <span class="visually-hidden" data-ui="text-size-status" role="status"></span>
      </div>
    </header>

    <main id="app" class="app-stage" tabindex="-1" aria-busy="true">
      <section class="loading-card" aria-label="Cargando">
        <div class="compass-loader" aria-hidden="true"></div>
        <p>Preparando el recorrido…</p>
      </section>
    </main>

    <footer class="site-footer">
      <span>Sin nota · sin nombres · tus respuestas quedan primero en este dispositivo</span>
      <span data-ui="version"></span>
    </footer>
  </div>

  <noscript>
    <p class="noscript-message">Esta herramienta necesita JavaScript para guardar tu avance en el dispositivo.</p>
  </noscript>
  <script type="module" src="./src/app.mjs"></script>
</body>
</html>
